[platformio]
boards_dir = boards

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit ILI9341@^1.6.2
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
build_flags =
  -D CORE_DEBUG_LEVEL=3

; Two firmware variants: hockey/Wi-Fi/OTA are identical; only football team changes.
[env:sparta]
extends = env:esp32-s3-devkitc-1-n16r8
build_flags =
  ${env:esp32-s3-devkitc-1-n16r8.build_flags}
  -D TFT_FOOTBALL_TEAM_CODE=\"SPA\"
  -D TFT_FOOTBALL_TEAM_LABEL=\"SPARTA\"

[env:slavia]
extends = env:esp32-s3-devkitc-1-n16r8
build_flags =
  ${env:esp32-s3-devkitc-1-n16r8.build_flags}
  -D TFT_FOOTBALL_TEAM_CODE=\"SKS\"
  -D TFT_FOOTBALL_TEAM_LABEL=\"SLAVIA\"
