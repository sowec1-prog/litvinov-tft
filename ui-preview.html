<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Litvínov & Sparta TFT – návrh UI</title>
<style>
  :root { --ink:#eef4ff; --muted:#9aa8bd; --line:#2a374b; --lime:#d8ff18; --red:#c8102e; }
  * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; background:#101419; font-family:Arial,sans-serif; color:var(--ink) }
  .device { width:min(960px,96vw); aspect-ratio:4/3; background:#05080d; border:12px solid #20262e; border-radius:18px; box-shadow:0 16px 60px #000; overflow:hidden; position:relative }
  .bar { height:10%; min-height:24px; padding:0 3% 0 13%; display:flex; align-items:center; justify-content:space-between; position:relative; border-bottom:1px solid var(--line); font-size:clamp(10px,2vw,20px); font-weight:bold; letter-spacing:.04em }.clock { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; color:var(--ink) }.bar-right { display:flex; align-items:center; gap:.8em }
  .signal { color:#64df7c }.battery { color:var(--lime) } .content { height:90%; padding:4%; display:grid; }
  .screen { display:none; height:100% }.screen.active { display:grid }.home { grid-template-rows:auto 1fr auto; text-align:center; gap:4% }.home h1 { margin:0; font-size:clamp(18px,4vw,42px); letter-spacing:.1em }.choices { display:grid; grid-template-columns:1fr 1fr; gap:4% }
  button { border:1px solid #35445a; border-radius:12px; color:var(--ink); background:#101823; cursor:pointer; font:inherit; font-weight:bold }
  button:active { transform:scale(.98) }.sport { display:grid; place-items:center; gap:4%; font-size:clamp(14px,3vw,30px) }.sport-icon { display:block; overflow:visible }.football-ball { width:clamp(88px,19vw,190px); aspect-ratio:1; background:#fff; border-radius:50%; padding:2px }.puck { width:clamp(110px,23vw,228px); height:auto }.ice { color:var(--lime) }.football { color:var(--red) }.brightness { display:grid; grid-template-columns:auto 1fr auto; gap:3%; align-items:center; color:var(--muted); font-size:clamp(10px,2vw,18px); padding:0 4% }.brightness output { color:var(--ink); min-width:3em; text-align:right } input { width:100%; accent-color:var(--lime) }
  .game { grid-template-rows:auto 1fr auto; gap:4% }.match-kind { margin:0; align-self:end; text-align:center; color:var(--muted); font-size:clamp(14px,3vw,30px); font-weight:bold; letter-spacing:.14em }.teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; text-align:center }.team { font-size:clamp(15px,3.8vw,38px); font-weight:bold }.badge { width:clamp(64px,14vw,142px); aspect-ratio:1; margin:auto; border-radius:50%; display:grid; place-items:center; border:3px solid currentColor; font-size:clamp(25px,6vw,60px) }.badge.logo { border:0; border-radius:0 }.badge.logo img { width:100%; height:100%; object-fit:contain }.score { font-size:clamp(42px,10vw,104px); font-weight:bold; padding:0 .25em }.scheduled-mark { color:var(--muted); font-size:clamp(25px,6vw,62px) }.status { border-top:1px solid var(--line); padding-top:3%; display:flex; justify-content:space-between; color:var(--muted); font-size:clamp(12px,2.5vw,25px) }.back { position:absolute; left:2%; top:2%; z-index:2; padding:.35em .6em; background:#192537; font-size:clamp(10px,2vw,18px) }
  .settings { grid-template-rows:auto 1fr; text-align:center }.settings h2 { margin:0; font-size:clamp(18px,4vw,38px) }.slider { display:grid; place-content:center; gap:8%; font-size:clamp(14px,3vw,28px) } input { width:min(500px,70vw); accent-color:var(--lime) }
</style>
<div class="device" id="device">
  <header class="bar"><span id="rank">LIT · 5.</span><span class="clock" id="clock" aria-label="datum a čas"></span><span class="bar-right"><span class="battery">▰ 82 %</span><span class="signal">▂▄▆█</span></span></header>
  <main class="content">
    <section class="screen home active" id="home"><h1>VYBER SPORT</h1><div class="choices"><button class="sport football" onclick="openScreen('football')"><img class="sport-icon football-ball" src="assets/soccer-ball.svg" alt="černobílý fotbalový míč"><span>FOTBAL<br>SPARTA</span></button><button class="sport ice" onclick="openScreen('hockey')"><img class="sport-icon puck" src="assets/hockey-puck.svg" alt="černý hokejový puk"><span>HOKEJ<br>LITVÍNOV</span></button></div><label class="brightness"><span>JAS</span><input id="brightness" type="range" min="20" max="100" value="82" oninput="setBrightness(this.value)"><output id="brightnessText">82 %</output></label></section>
    <section class="screen game" id="hockey" data-start="2026-10-27T18:00:00+01:00"><p class="match-kind">DALŠÍ ZÁPAS</p><div class="teams"><div class="team ice"><div class="badge logo"><img src="assets/litvinov-logo.png" alt="logo HC VERVA Litvínov"></div>VERVA</div><div class="scheduled-mark">VS</div><div class="team"><div class="badge logo"><img src="assets/kometa-logo.png" alt="logo HC Kometa Brno"></div>KOMETA</div></div><div class="status"><span>ÚT 27. 10. · 18:00</span><span class="countdown">ZA 2 DNY</span></div></section>
    <section class="screen game" id="football" data-start="2026-11-15T15:00:00+01:00"><p class="match-kind">DALŠÍ ZÁPAS</p><div class="teams"><div class="team football"><div class="badge logo"><img src="assets/sparta-football-logo.svg" alt="logo AC Sparta Praha"></div>SPARTA</div><div class="scheduled-mark">VS</div><div class="team"><div class="badge logo"><img src="assets/slovacko-logo.webp" alt="logo 1. FC Slovácko"></div>SLOVÁCKO</div></div><div class="status"><span>NE 15. 11. · 15:00</span><span class="countdown">ZA 21 DNÍ</span></div></section>
  </main>
  <button class="back" onclick="openScreen('home')">⌂ ZPĚT</button>
</div>
<script>
function openScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id)); document.querySelector('.back').style.display=id==='home'?'none':'block'; document.getElementById('rank').textContent=id==='football'?'SPA · 2.':'LIT · 5.'}
function setBrightness(v){document.getElementById('brightnessText').textContent=v+' %';document.getElementById('device').style.filter='brightness('+v/100+')'}
function updateClock(now=new Date()){
  const date=now.toLocaleDateString('cs-CZ',{weekday:'short',day:'2-digit',month:'2-digit',timeZone:'Europe/Prague'}).toUpperCase();
  const time=now.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Prague'});
  document.getElementById('clock').textContent=`${date} · ${time}`;
}
function pluralDays(days){return days===1?'DEN':days<5?'DNY':'DNÍ'}
function formatCountdown(target, now=Date.now()){
  const milliseconds=target-now;
  if(milliseconds<=0)return 'ZAČÍNÁ';
  const current=new Date(now), kickoff=new Date(target);
  const currentDate=new Date(current.getFullYear(),current.getMonth(),current.getDate());
  const kickoffDate=new Date(kickoff.getFullYear(),kickoff.getMonth(),kickoff.getDate());
  const days=Math.round((kickoffDate-currentDate)/86400000);
  if(days>=1)return `ZA ${days} ${pluralDays(days)}`;
  const seconds=Math.floor(milliseconds/1000);
  if(seconds>3600)return `ZA ${Math.ceil(seconds/3600)} H`;
  if(seconds>600)return `ZA ${Math.ceil(seconds/60)} MIN`;
  return `ZA ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}
function updateCountdowns(now=Date.now()){document.querySelectorAll('.game[data-start]').forEach(game=>game.querySelector('.countdown').textContent=formatCountdown(new Date(game.dataset.start).getTime(),now))}
updateCountdowns(); setInterval(updateCountdowns,1000);
updateClock(); setInterval(updateClock,1000);
openScreen('home');
</script>
